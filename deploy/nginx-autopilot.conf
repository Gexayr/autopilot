server {
    server_name autopilot.amsoft.am;
    # no X-Frame-Options: the Telegram Mini App is shown in an iframe on web.telegram.org
    include /etc/nginx/snippets/sec-headers.conf;

    access_log /var/log/nginx/autopilot.access.log;
    error_log /var/log/nginx/autopilot.error.log;

    # Post media: Instagram and Telegram download files from here (random names, no listing)
    location /media/ {
        alias /var/www/autopilot-media/;
        autoindex off;
        location ~ /\. { deny all; }
    }

    # Own photos/videos uploaded from the website (Reels up to 200 MB)
    location = /api/uploads {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    listen 80;
}
