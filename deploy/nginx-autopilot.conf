server {
    server_name autopilot.amsoft.am;
    include /etc/nginx/snippets/sec-headers.conf;

    access_log /var/log/nginx/autopilot.access.log;
    error_log /var/log/nginx/autopilot.error.log;

    # Post media: Instagram and Telegram download files from here (random names, no listing)
    location /media/ {
        alias /var/www/autopilot-media/;
        autoindex off;
        location ~ /\. { deny all; }
    }

    # Own photos/videos uploaded from the website (Reels up to 200 MB)
    location = /api/uploads {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Character / world reference pictures and feedback screenshots (the app allows up to 15 MB)
    location ~ ^/api/(pages/\d+/character/refs|feedback)$ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16m;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/autopilot.amsoft.am/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/autopilot.amsoft.am/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = autopilot.amsoft.am) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name autopilot.amsoft.am;

    listen 80;
    return 404; # managed by Certbot


}